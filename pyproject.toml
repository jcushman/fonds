[project]
name = "fonds"
version = "0.1.0"
description = "Manage a metarepo: a workspace of many git repos, with inventory, tags, and analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Jack Cushman" }]
keywords = ["git", "github", "monorepo", "metarepo", "multi-repo", "inventory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/jcushman/fonds"
Source = "https://github.com/jcushman/fonds"
Issues = "https://github.com/jcushman/fonds/issues"

[project.scripts]
fonds = "fonds.cli:main"

# Third-party plugins register themselves here; see fonds/plugins/__init__.py.
[project.entry-points."fonds.plugins"]

[dependency-groups]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fonds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
